# SENIOR CHECKPOINT
# Closeout compliance sensor. Maps to AGENTS.md.
# PRE: fill gate before the first edit.
# CLOSE: fill the 5 confessions, note, not_verified, and next_action.

task: "<short descriptive id>"
date: "<YYYY-MM-DD>"

# PRE: binary. "escalate" stops execution and asks the human before continuing.
gate: "<ok | escalate>"

# CLOSE: 5 confessions. If any is true, add one line in `note`.
violations:
  protected_without_escalation: false
  assumed_without_asking:      false
  over_engineering:            false
  undefined_success:           false
  claim_without_evidence:      false

# One line if something was violated. Empty if clean.
# Format: "<what>; <why>; <what I did or what changes>"
note: ""

# What I did not verify. Pure honesty.
not_verified: []

# "none" if not applicable, or concrete text with trigger.
next_action: "none"
